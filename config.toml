# Configuration for the Toronto interpolation-cleanup MapRoulette tool.

[t2]
# Root of the sibling toronto-2-address-import project. Its `t2` package is
# imported for read-only access to the Toronto address DB (source_db) and the
# street-name normalizer (conflate.normalize_street). The source SQLite path
# itself is read from that project's own config.toml — we don't duplicate it.
root = "C:/Users/kk/Code/toronto-2-address-import"

[osm]
# City-of-Toronto-ish clip. Same rectangle the import uses.
toronto_bbox = [43.58, -79.64, 43.86, -79.11]
overpass_url = "https://overpass-api.de/api/interpreter"
# The bbox is fetched as a grid of tiles this many degrees on a side, so a
# single Overpass request never has to return the whole city's worth of
# interpolation ways. ~0.05 deg keeps each tile a few thousand ways.
tile_deg = 0.05
# Polite delay (seconds) between Overpass tile requests.
request_delay_s = 1.0

[coverage]
# A Toronto source address point counts as "covering" a housenumber in an
# interpolation range only if its normalized street matches AND it lies within
# this distance of the interpolation line. The distance guard disambiguates the
# same street name across municipalities (e.g. several "Main St" in the GTA).
match_radius_m = 150

[maproulette]
api_base = "https://maproulette.org/api/v2"
# REQUIRED before `create`: the MapRoulette project the challenge lands in.
project_id = 63965
challenge_name = "Toronto address interpolation cleanup"
# Tasks per addTasks request when uploading.
upload_batch_size = 1000
